  # ============================================================================
  # HOME INFRASTRUCTURE
  # ============================================================================

  # Tapo Cameras
  - job_name: 'tapo-cameras'
    static_configs:
      - targets: ['tapo-cameras:8000']
    scrape_interval: 30s
    metrics_path: /metrics
    scrape_timeout: 10s

  # Nest Protect
  - job_name: 'nest-protect'
    static_configs:
      - targets: ['nest-protect:8000']
    scrape_interval: 30s
    metrics_path: /metrics
