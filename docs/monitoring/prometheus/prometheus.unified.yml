  # Ring Devices
  - job_name: 'ring-devices'
    static_configs:
      - targets: ['ring-devices:8000']
    scrape_interval: 30s
    metrics_path: /metrics
    scrape_timeout: 10s

  # Smart Plugs (Energy Monitoring)
  - job_name: 'smart-plugs'
    static_configs:
      - targets: ['smart-plugs:8000']
    scrape_interval: 30s
    metrics_path: /metrics
    scrape_timeout: 10s

  # ============================================================================
  # EXTERNAL SERVICES
  # ============================================================================

  # Docker Daemon Metrics (if available)
  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:9323']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Redis (if available)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s
    scrape_timeout: 10s

  # PostgreSQL (if available)
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s
    scrape_timeout: 10s

  # ============================================================================
  # DYNAMIC SERVICE DISCOVERY
  # ============================================================================

  # Docker Service Discovery
  - job_name: 'docker-services'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["monitoring=enabled"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/?(.*)'
        target_label: 'container_name'
      - source_labels: [__meta_docker_container_label_monitoring_job]
        target_label: 'job'
      - source_labels: [__meta_docker_container_label_monitoring_port]
        target_label: '__address__'
        regex: '(.+)'
        replacement: '${1}'
      - source_labels: [__meta_docker_container_label_monitoring_path]
        target_label: '__metrics_path__'
        regex: '(.+)'
        replacement: '${1}'
