global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'unified-monitoring'
    replica: 'prometheus-1'

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 5s
    metrics_path: /metrics

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 30s
    metrics_path: /metrics

  # Loki
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    scrape_interval: 30s
    metrics_path: /metrics

  # Promtail
  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']
    scrape_interval: 30s
    metrics_path: /metrics

  # Node Exporter - System Metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
    metrics_path: /metrics

  # cAdvisor - Container Metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
    metrics_path: /metrics

  # RebootX On-Prem
  - job_name: 'rebootx-on-prem'
    static_configs:
      - targets: ['rebootx-on-prem:12010']
    scrape_interval: 30s
    metrics_path: /metrics

  # ============================================================================
  # MCP SERVERS
  # ============================================================================

  # Tailscale MCP Server
  - job_name: 'tailscale-mcp'
    static_configs:
      - targets: ['tailscale-mcp:9091']
    scrape_interval: 30s
    metrics_path: /metrics
    scrape_timeout: 10s

  # Virtualization MCP Server
  - job_name: 'virtualization-mcp'
    static_configs:
      - targets: ['virtualization-mcp:9091']
    scrape_interval: 30s
    metrics_path: /metrics
    scrape_timeout: 10s

  # Database Operations MCP Server
  - job_name: 'database-operations-mcp'
    static_configs:
      - targets: ['database-operations-mcp:9091']
    scrape_interval: 30s
    metrics_path: /metrics
    scrape_timeout: 10s

  # Windows Operations MCP Server
