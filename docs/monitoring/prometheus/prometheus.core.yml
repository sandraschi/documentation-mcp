# Core scrape targets — unified monitoring stack only (Docker Compose service names).
# Add fleet MCP / MyAI jobs in prometheus.fleet.yml and merge when those services run.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: unified-monitoring

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
    metrics_path: /metrics

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
    metrics_path: /metrics

  - job_name: promtail
    static_configs:
      - targets: ["promtail:9080"]
    metrics_path: /metrics

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
