services:
  rebootx-on-prem:
    image: golang:1.22
    environment:
      - RBTX_API_KEY=${REBOOTX_API_KEY:-unified-monitoring-rebootx-key}
      - RBTX_PATH_PREFIX=unified-monitoring
      - RBTX_DASHBOARD_SERVICE_FILE_JSON_FILE_PATH=/data/dashboards.json
      - RBTX_DASHBOARD_SERVICE_IMPL=fileJson
      - RBTX_PORT=12010
      - RBTX_RUNNABLE_SERVICE_FILE_JSON_FILE_PATH=/data/servers.json
      - RBTX_RUNNABLE_SERVICE_IMPL=fileJson
      - RBTX_BIND=0.0.0.0
      - RBTX_PROTOCOL=http
    ports:
      - "12010:12010"
    volumes:
      - ./data:/data
      - ./impl:/app
    working_dir: "/app"
    command: bash -c "cd /app/http-server-go && go fmt && go build -o /build/rebootx-on-prem -v && /build/rebootx-on-prem"
    networks:
      - unified-monitoring
    depends_on:
      - grafana
      - prometheus

  rebootx-swagger-ui:
    image: swaggerapi/swagger-ui:v5.12.0
    environment:
      - PORT=12011
      - SWAGGER_JSON=/spec/swagger.json
    ports:
      - "12011:12011"
    volumes:
      - ./spec:/spec
    networks:
      - unified-monitoring
    depends_on:
      - rebootx-on-prem

networks:
  monitoring:
    external: true
