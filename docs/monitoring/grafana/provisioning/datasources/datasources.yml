apiVersion: 1

datasources:
  # Prometheus datasource
  - name: Prometheus
    uid: prometheus
    orgId: 1
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    version: 1
    jsonData:
      timeInterval: "5s"
      queryTimeout: "60s"
      httpMethod: "POST"

  # Loki datasource for logs
  - name: Loki
    uid: loki
    orgId: 1
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    version: 1
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: "trace_id=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"

  # Tempo — distributed trace storage (OTel pipeline)
  - name: Tempo
    uid: tempo
    orgId: 1
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    version: 1
    jsonData:
      tracesToLogs:
        datasourceUid: loki
        tags: ["service.name", "fleet.cluster"]
      tracesToMetrics:
        datasourceUid: prometheus
        tags: [{key: "service.name", value: "service_name"}]
        queries:
          - name: "Request rate"
            query: "rate(mcp_tool_calls_total{service_name=~'$${__span.tags.service.name}'}[5m])"

  # Grafana self-metrics (optional; stable uid for Grafana 13 provisioning)
  - name: Grafana
    uid: grafana-metrics
    orgId: 1
    type: prometheus
    access: proxy
    url: http://grafana:3000/metrics
    editable: true
    version: 1
    jsonData:
      timeInterval: "10s"
