# OTel Collector — receives OTLP from 50+ fleet MCP servers
# Exports: traces → Tempo, metrics → Prometheus
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  attributes:
    actions:
      - key: fleet.cluster
        value: sandraschi-mcp
        action: upsert

exporters:
  # Metrics → Prometheus scrape target
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: mcp_fleet
    resource_to_telemetry_conversion:
      enabled: true
  # Traces → Tempo (OTLP gRPC)
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Debug exporter (verbose: false = just count summary, not full payloads)
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [prometheus]
