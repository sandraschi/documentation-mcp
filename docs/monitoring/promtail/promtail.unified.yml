    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:

  # Database Operations MCP Server
  - job_name: database-operations-mcp
    static_configs:
      - targets:
          - localhost
        labels:
          job: database-operations-mcp
          service: mcp-server
          __path__: /var/log/mcp/database-operations-mcp/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
      - timestamp:
