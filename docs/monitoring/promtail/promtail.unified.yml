          level:
          service:

  # ============================================================================
  # VEOGEN PLATFORM LOGS
  # ============================================================================

  # VeoGen Backend
  - job_name: veogen-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: veogen-backend
