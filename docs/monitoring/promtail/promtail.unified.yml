    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:

  # MyAI Calibre Plus
  - job_name: myai-calibre-plus
    static_configs:
      - targets:
