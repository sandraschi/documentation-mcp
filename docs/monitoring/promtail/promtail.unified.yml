      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:

  # ============================================================================
  # HOME INFRASTRUCTURE LOGS
  # ============================================================================

  # Tapo Cameras
  - job_name: tapo-cameras
    static_configs:
      - targets:
          - localhost
        labels:
          job: tapo-cameras
          service: home-infrastructure
          __path__: /var/log/home/tapo-cameras/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:

  # Nest Protect
  - job_name: nest-protect
    static_configs:
      - targets:
          - localhost
        labels:
          job: nest-protect
          service: home-infrastructure
          __path__: /var/log/home/nest-protect/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:

  # ============================================================================
  # DOCKER CONTAINER LOGS
  # ============================================================================

  # Opt-in: any repo labels its compose service with monitoring.unified=true
  - job_name: fleet-mcp-labeled
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["monitoring.unified=true"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_monitoring_job']
        regex: (.+)
        target_label: job
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: logstream

  # Known fleet MCP container names (no label required)
  - job_name: fleet-mcp-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '(?i).*(devices-mcp|plex|calibre|avatar|tailscale|github-mcp|rtorrent|calibre-plus|unified-|immich|jellyfin).*'
        action: keep
      - source_labels: ['__meta_docker_container_label_monitoring_job']
        regex: (.+)
        target_label: job
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: logstream

  # Legacy: logging=promtail label
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(.*)'
        target_label: 'container_name'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_label_logging_job_name']
        target_label: 'job'
      - source_labels: ['__meta_docker_container_label_logging_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_logging_level']
        target_label: 'level'
    pipeline_stages:
      - json:
          expressions:
            timestamp: time
            level: level
            message: msg
            service: service
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:

  # ============================================================================
  # APPLICATION LOGS
  # ============================================================================

  # Generic application logs
  - job_name: applications
    static_configs:
      - targets:
          - localhost
        labels:
          job: applications
          __path__: /var/log/applications/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:

  # ============================================================================
  # ERROR LOGS
  # ============================================================================

  # Error logs from all sources
  - job_name: errors
    static_configs:
      - targets:
          - localhost
        labels:
          job: errors
          __path__: /var/log/errors/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            error_type: error_type
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:
          error_type:
