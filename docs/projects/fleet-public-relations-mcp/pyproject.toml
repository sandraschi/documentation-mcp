[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleet-public-relations-mcp"
version = "0.1.0"
description = "Private MCP server for fleet PR outreach: thread monitoring, LLM competency triage, and Admiral escalation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "starlette>=1.0.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "curl-cffi>=0.7.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio", "httpx"]
dev = ["ruff>=0.9.0"]

[project.scripts]
fleet-pr-mcp = "fleet_public_relations_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_public_relations_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
