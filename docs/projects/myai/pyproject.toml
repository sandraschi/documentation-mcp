[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myai-llm"
version = "0.2.0"
description = "A comprehensive AI development platform with multiple specialized applications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MyAI Team", email = "team@myai.dev"},
]
maintainers = [
    {name = "MyAI Team", email = "team@myai.dev"},
]
keywords = [
    "ai", "llm", "machine-learning", "flask", "fastapi", "docker", "ollama",
    "conversation", "chatbot", "automation", "multimodal"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: Flask",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]

# Core dependencies
dependencies = [
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
    "pydantic>=2.5.0",
    "prefab-ui>=0.14.0",
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psutil>=5.9.0",
    "click>=8.1.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
# LLM integrations
llm = [
    "openai>=1.6.0",
    "anthropic>=0.8.0",
    "google-generativeai>=0.3.0",
    "ollama>=0.1.0",
]

# Document processing
documents = [
    "PyPDF2>=3.0.0",
    "python-docx>=0.8.11",
    "python-pptx>=0.6.21",
    "beautifulsoup4>=4.12.0",
    "html2text>=2020.1.16",
    "chromadb>=0.4.18",
    "sentence-transformers>=2.2.2",
]

# Image and video processing
media = [
    "Pillow>=10.1.0",
    "opencv-python>=4.8.0",
    "gradio>=4.8.0",
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "bandit[toml]>=1.7.5",
    "safety>=2.3.0",
    "pre-commit>=3.6.0",
    "coverage>=7.3.0",
]

# Testing dependencies
testing = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "factory-boy>=3.3.0",
    "faker>=20.1.0",
]

# Production dependencies
prod = [
    "gunicorn>=21.2.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "prometheus-client>=0.19.0",
    "structlog>=23.2.0",
]

# All optional dependencies
all = [
    "myai-llm[llm,documents,media,dev,testing,prod]"
]

[project.urls]
Homepage = "https://github.com/yourusername/myai"
Documentation = "https://github.com/yourusername/myai#readme"
Repository = "https://github.com/yourusername/myai.git"
Issues = "https://github.com/yourusername/myai/issues"
Changelog = "https://github.com/yourusername/myai/blob/main/CHANGELOG.md"

[project.scripts]
myai-start = "myai.cli:start_command"
myai-stop = "myai.cli:stop_command"
myai-status = "myai.cli:status_command"
myai-platform = "myai_platform_mcp.server:main"

# Tools configuration
[tool.setuptools.packages.find]
where = [".", "src"]
include = ["bob_and_alice*", "dashboard*", "gemini_tools*", "utils*", "llm_integration*", "myai_platform_mcp*"]
exclude = ["tests*", "docs*", "*.windsurf*"]

[tool.setuptools.package-data]
"*" = ["*.yml", "*.yaml", "*.json", "*.md", "*.txt"]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \\.eggs
  | \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | \\.windsurf
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["bob_and_alice", "dashboard", "gemini_tools", "utils", "llm_integration"]
known_third_party = ["flask", "fastapi", "pydantic", "sqlalchemy", "requests", "ollama"]
skip_glob = ["*/node_modules/*", "*/.windsurf/*", "*/venv/*", "*/build/*"]

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=70",
    "--tb=short",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "api: marks tests as API tests",
    "security: marks tests as security tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/.windsurf/*",
    "*/node_modules/*",
    "*/venv/*",
    "*/build/*",
    "*/dist/*",
    "*/__pycache__/*",
    "*/.*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false
precision = 2

# MyPy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
ignore_missing_imports = true

# Per-module MyPy options
[[tool.mypy.overrides]]
module = [
    "tests.*",
    "*.tests.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "gradio.*",
    "chromadb.*",
    "ollama.*",
]
ignore_missing_imports = true

# Bandit security configuration
[tool.bandit]
exclude_dirs = ["tests", "node_modules", ".windsurf", "venv", "build", "dist"]
tests = ["B201", "B301", "B401", "B501", "B601", "B602", "B603", "B604", "B605", "B606", "B607", "B608", "B609", "B610", "B611"]
skips = ["B101", "B601"]  # Skip assert_used and shell_injection for tests

[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/tests.py"]

# Ruff configuration (SOTA Python linter & formatter)





[tool.setuptools]
zip-safe = false

# Note: Dynamic version/description disabled - using static values from [project] section
# If you need dynamic version, create a myai/__init__.py with __version__ attribute

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
