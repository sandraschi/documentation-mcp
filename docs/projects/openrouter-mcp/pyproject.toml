[project]
name = "openrouter-mcp"
version = "0.1.0"
description = "SOTA 2026 OpenRouter MCP Server"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.0.0",
]
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio", "httpx"]
dev = ["ruff>=0.9.0", "mypy"]

[project.scripts]
openrouter-mcp = "openrouter_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
