[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secrets-mcp"
version = "0.1.0"
description = "Fleet credential vault bridge — Bitwarden CLI integration, audit scanner, and YAML-registry ref resolver"
authors = [{ name = "sandraschi" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.2,<4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.14"]

[project.scripts]
secrets-mcp = "secrets_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secrets_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "SIM", "ARG", "C4", "PL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["src"]
omit = ["src/*/__pycache__/*"]
