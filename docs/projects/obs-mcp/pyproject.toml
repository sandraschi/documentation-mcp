[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obs-studio-mcp"
version = "0.1.0"
description = "MCP server for automating OBS Studio with AI-powered scene management and streaming control"
authors = [{name = "Sandra Schi", email = "sandra@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Networking",
]
dependencies = [
    "fastmcp>=3.1.0,<4",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "obsws-python>=1.8.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.15.2",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
obs-studio-mcp = "obs_studio_mcp.mcp_server:main"
obs-studio-rest = "obs_studio_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-python-dateutil",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/sandraschi/obs-studio-mcp"
Documentation = "https://github.com/sandraschi/obs-studio-mcp#readme"
Issues = "https://github.com/sandraschi/obs-studio-mcp/issues"
Source = "https://github.com/sandraschi/obs-studio-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "TD", "FIX", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF"]
ignore = ["E501", "PLR0913", "PLR0912"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
show_error_context = true
pretty = true
show_column_numbers = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = "test_*"
python_classes = "Test*"
addopts = "-v --cov=obs_studio_mcp --cov-report=term-missing"
asyncio_mode = "auto"

[coverage.run]
source = ["obs_studio_mcp"]
omit = ["tests/*", "*/__init__.py"]

[coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

# MCPB Packaging Configuration - SOTA Standards
[tool.mcpb]
name = "obs-studio-mcp"
version = "0.1.0"
description = "MCP server for automating OBS Studio with AI-powered scene management and streaming control"
author = "Sandra Schi"
author_email = "sandra@example.com"
license = "MIT"
homepage = "https://github.com/sandraschi/obs-studio-mcp"
repository = "https://github.com/sandraschi/obs-studio-mcp"
documentation = "https://github.com/sandraschi/obs-studio-mcp#readme"
keywords = ["obs", "streaming", "broadcasting", "recording", "automation", "mcp", "fastmcp", "obs-studio", "live-streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Networking",
]
