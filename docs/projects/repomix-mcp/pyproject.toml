[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repomix-mcp"
version = "0.1.0"
description = "MCP server for packing repositories into AI-friendly formats using Repomix"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "FlowEngineer sandraschi", email = "sandraschi@example.com"},
]
maintainers = [
    {name = "FlowEngineer sandraschi", email = "sandraschi@example.com"},
]
keywords = [
    "mcp",
    "model-context-protocol",
    "repomix",
    "repository",
    "analysis",
    "ai",
    "codebase",
    "compression",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "fastmcp>=3.1.0,<4",
    "pydantic>=2.0.0",
    "pathlib>=1.0.0",
    "ruff>=0.15.2",
]

[project.urls]
Homepage = "https://github.com/mlopezgez/mcp-server-repomix"
Repository = "https://github.com/mlopezgez/mcp-server-repomix"
Issues = "https://github.com/mlopezgez/mcp-server-repomix/issues"
Changelog = "https://github.com/mlopezgez/mcp-server-repomix/blob/main/CHANGELOG.md"

[project.scripts]
repomix-mcp = "repomix_mcp.server:main"

[tool.setuptools]
packages = ["repomix_mcp"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
repomix_mcp = ["*.txt", "*.md"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "fastmcp.*",
]
ignore_missing_imports = true
