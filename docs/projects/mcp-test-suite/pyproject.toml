[project]
name = "mcp-test-suite"
version = "0.1.0"
description = "Fleet contract smoke tests — health and registry trust layer (P5)"
readme = "README.md"
keywords = ["model-context-protocol", "mcp-server", "smoke-testing", "contract-tests", "port-collision", "fleet-health"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.scripts]
fleet-smoke = "mcp_test_suite.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_test_suite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
