[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moltbot-mcp"
version = "0.1.0"
description = "MCP server for Moltbot (ClawdBot) Gateway: status, send, agent, and bridge tools"
authors = [{ name = "Sandra Schi" }]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp>=3.1.0,<4",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.14.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
]

[project.scripts]
moltbot-mcp = "moltbot_mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/moltbot_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v"

[tool.coverage.run]
source = ["src/moltbot_mcp"]
omit = ["*/tests/*", "*/__pycache__/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mcpb]
name = "moltbot-mcp"
version = "0.1.0"
description = "MCP server for Moltbot Gateway bridge and control"
keywords = ["moltbot", "clawdbot", "gateway", "mcp", "fastmcp", "assistant"]
