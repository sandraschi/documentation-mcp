[project]
name = "vbot-mind-mcp"
version = "0.2.0"
description = "V-Bot Mind MCP — autonomous virtual robot brain: perception, LLM reasoning, episodic memory, personality, and motor output for fleet V-Bots in Godot/Unity3D/Resonite."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sandra Schipal", email = "sandra@fleet.ai" }]
keywords = ["vbot", "virtual-robot", "ai-npc", "mcp", "fastmcp", "llm-agent", "vr", "godot", "unity3d"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastmcp>=3.4.4,<4",
    "httpx>=0.28.0",
    "fastapi[standard]>=0.115.8",
    "uvicorn[standard]>=0.34.0",
    "pydantic[email,timezone]>=2.10.3",
    "prefab-ui>=0.14.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
    "pyinstaller>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
]

[project.scripts]
vbot-mind = "vbot_mind.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vbot_mind"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src", "tests"]
testpaths = ["tests"]
