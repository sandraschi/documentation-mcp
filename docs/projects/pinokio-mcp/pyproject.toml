[project]
name = "pinokio-mcp"
version = "1.0.0"
description = "MCP server for controlling Pinokio - the 1-click localhost cloud for AI apps"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
keywords = [
    "mcp",
    "pinokio",
    "ai",
    "localhost",
    "model-context-protocol",
    "claude",
    "cursor",
    "fastmcp"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastmcp>=3.1.0,<4",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "ruff>=0.15.2",
    "zeroconf>=0.132.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
pinokio-mcp = "pinokio_mcp.server:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/pinokio-mcp"
Repository = "https://github.com/YOUR_USERNAME/pinokio-mcp"
Documentation = "https://github.com/YOUR_USERNAME/pinokio-mcp#readme"
Issues = "https://github.com/YOUR_USERNAME/pinokio-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinokio_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# =============================================================================
# MCPB Configuration
# =============================================================================
[tool.mcpb]
name = "pinokio-mcp"
description = "MCP server for Pinokio - control AI apps with Claude/Cursor"
version = "1.0.0"

[tool.mcpb.server]
command = "uvx"
args = ["pinokio-mcp"]

[tool.mcpb.env]
PINOKIO_HOST = { default = "localhost", description = "Pinokio host address" }
PINOKIO_PORT = { default = "", description = "Pinokio port (auto-discover if empty)" }
PINOKIO_HOME = { default = "~/pinokio", description = "Pinokio home directory" }

