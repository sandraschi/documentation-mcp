[build-system]
requires = ["setuptools>=42.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vroidstudio-mcp"
version = "0.2.0-alpha"
description = "ðŸš¨ ALPHA: FastMCP 2.14.1+ SOTA-compliant server for VRoid Studio automation - CURRENTLY MOCKED, planning Windows UI automation"
authors = [{name = "sandraschi", email = "sandra@flowengineer.com"}]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: Microsoft :: Windows"
]
dependencies = [
    "fastmcp>=3.1.0,<4",
    "pywin32>=305;platform_system=='Windows'",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.0.0; python_version < '3.10'",
    "pathlib2>=2.3.0; python_version < '3.4'",
]

[project.urls]
Homepage = "https://github.com/sandraschi/vroidstudio-mcp"
Documentation = "https://github.com/sandraschi/vroidstudio-mcp#readme"
Issues = "https://github.com/sandraschi/vroidstudio-mcp/issues"
Source = "https://github.com/sandraschi/vroidstudio-mcp"

[project.scripts]
vroidstudio-mcp = "vroidstudio_mcp.cli:main"

[project.entry-points.'mcp.server']
vroidstudio = "vroidstudio_mcp.server:VRoidStudioMCPServer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["vroidstudio_mcp"]
known_third_party = ["fastmcp", "pydantic"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0"
]
dev = [
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "pylint>=3.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
