[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[project]
name = "loona-mcp"
version = "0.1.0"
description = "FastMCP 3.2+ server for KEYi Loona Petbot — hardware reverse engineering, motor/sensor control, AI companion stack"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sandra Schipal", email = "sandra@schipal.at" }
]
keywords = ["mcp", "loona", "petbot", "keyi", "robot", "reverse-engineering", "fastmcp", "hardware-hacking"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.18.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "ruff>=0.14.0",
    "pre-commit>=3.6.0",
]
adb = [
    "adb-shell>=0.4.0",
]
gpio = [
    "RPi.GPIO>=0.7.0",
]

[project.scripts]
loona-mcp = "loona_mcp.server:main"

[project.urls]
Homepage = "https://github.com/sandraschi/loona-mcp"
Repository = "https://github.com/sandraschi/loona-mcp.git"

[tool.hatch.build.targets.wheel]
packages = ["src/loona_mcp"]

[tool.uv-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "A", "C4", "T20", "RET", "SIM", "ARG", "TRY"]
ignore = ["E501", "E402", "B008", "TRY003", "TRY300", "TRY301", "TRY400", "TRY401", "ARG001", "ARG002", "A002", "A001", "N802", "N816", "S110", "B904", "SIM105", "UP041", "S101", "S112"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring Loona hardware or ADB connection",
    "hardware: tests that touch physical robot hardware",
]
addopts = "-ra --strict-markers"
