[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jtag-swd-mcp"
version = "0.1.0"
description = "FastMCP 3.2+ — OpenOCD JTAG/SWD debug bridge and simulator."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sandra Schipal", email = "sandra@schipal.at" }]
dependencies = [
    "fastmcp>=3.4.4,<4",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.14.0"]

[project.scripts]
jtag-swd-mcp = "jtag_swd_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jtag_swd_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
