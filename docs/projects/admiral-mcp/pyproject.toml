[project]
name = "admiral-mcp"
version = "0.1.0"
description = "Agent-harness-to-iPhone pager bridge — FastMCP server with APNs push relay"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Sandra Schipal", email = "sandra@example.com"},
]

dependencies = [
    "fastmcp>=3.4.4,<4",
    "starlette>=1.0.0",
    "uvicorn[standard]>=0.34.0",
    "prefab-ui>=0.14.0",
    "aioapns>=3.2",
    "pydantic>=2.0",
    "httpx>=0.28.0",
]

[project.scripts]
admiral-mcp = "admiral_mcp.server:main"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
