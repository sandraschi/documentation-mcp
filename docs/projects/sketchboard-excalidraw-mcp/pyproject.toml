[project]
name = "sketchboard-excalidraw-mcp"
version = "0.1.0"
description = "Excalidraw canvas + headless-render MCP server (fleet fork/merge of lesleslie/excalidraw-mcp and bassimeledath/excalidraw-render-mcp)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sandra Schi" }]
dependencies = [
    "fastmcp>=3.4.4,<4",
    "prefab-ui",
    "starlette",
    "uvicorn",
    "playwright",
    "pydantic>=2",
]

[project.scripts]
sketchboard-excalidraw-mcp = "sketchboard_excalidraw_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sketchboard_excalidraw_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "render_integration: launches real headless Chromium + fetches from esm.sh; slow, needs network, excluded by default",
]
addopts = "-m 'not render_integration'"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
