[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-mcp"
version = "1.1.0"
description = "FastMCP 3.2 server for Obsidian vault knowledge management with Obsidian CLI 1.12+ support"
authors = [
    {name = "Sandra", email = "sandra@theagenticmines.at"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["mcp", "obsidian", "notes", "knowledge", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "fastmcp>=3.4.4,<4",
    "pydantic>=2.0.0",
    "python-frontmatter>=1.0.0",
    "pyyaml>=6.0",
    "aiofiles>=23.0.0",
    "httpx>=0.27.0",
    "lancedb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.14.0",
]

[project.urls]
Repository = "https://github.com/sandraschi/obsidianmcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --ignore=tests/integration_tests.py --ignore=tests/test_manager.py"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow running tests",
    "canvas: canvas-related tests",
    "vault: vault operation tests",
    "gateway: FastAPI gateway tests",
]

[tool.coverage.run]
source = ["obsidian_mcp"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008", "S110", "S112", "B904", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
