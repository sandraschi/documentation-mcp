[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-generator"
version = "1.0.0"
description = "FastMCP MCP Server Generator and Template"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "fastmcp>=3.1.0,<4",
    "typing-extensions>=4.0.0",
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "httpx>=0.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=0.991",
    "isort>=5.12.0"
]

[project.scripts]
mcp-generate = "src.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/mcp-server-generator"
Documentation = "https://github.com/yourusername/mcp-server-generator#readme"
Issues = "https://github.com/yourusername/mcp-server-generator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
